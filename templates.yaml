# テンプレート編集前に必ずバックアップを取ること:
# cp templates.yaml templates_backup_$(date +%Y%m%d).yaml
#
# テンプレートは10件以内を推奨

- category: "ログイン"
  keywords:
    - "ログインできない"
    - "パスワード"
    - "ログイン"
    - "サインイン"
  template: |
    お問い合わせいただきありがとうございます。

    ログインに関するお問い合わせですね。
    以下の手順をお試しください：

    1. パスワードリセットページからパスワードを再設定してください。
    2. ブラウザのキャッシュとCookieをクリアしてから再度お試しください。
    3. 別のブラウザやシークレットモードでもお試しください。

    上記で解決しない場合は、お手数ですが再度ご連絡ください。

- category: "出金"
  keywords:
    - "出金"
    - "引き出し"
    - "振込"
    - "送金"
  template: |
    お問い合わせいただきありがとうございます。

    出金に関するお問い合わせですね。
    出金処理には通常1〜3営業日ほどお時間をいただいております。

    出金申請がお済みでない場合は、マイページの「出金」メニューからお手続きください。
    申請済みの場合は、処理状況をマイページでご確認いただけます。

    ご不明な点がございましたら、お気軽にご連絡ください。

- category: "入金"
  keywords:
    - "入金"
    - "デポジット"
    - "振り込み"
    - "反映されない"
  template: |
    お問い合わせいただきありがとうございます。

    入金に関するお問い合わせですね。
    入金の反映には、お支払い方法により以下の時間がかかります：

    ・クレジットカード：即時〜数分
    ・銀行振込：1〜2営業日
    ・電子決済：即時〜数時間

    反映されない場合は、入金元の明細をご確認の上、再度ご連絡ください。

- category: "口座開設"
  keywords:
    - "口座開設"
    - "アカウント作成"
    - "登録"
    - "新規"
  template: |
    お問い合わせいただきありがとうございます。

    口座開設に関するお問い合わせですね。
    口座開設は以下の手順で行えます：

    1. 公式サイトの「口座開設」ボタンをクリック
    2. 必要情報を入力
    3. 本人確認書類をアップロード
    4. 審査完了後、メールでご連絡いたします

    審査には通常1〜2営業日ほどお時間をいただいております。

- category: "本人確認"
  keywords:
    - "本人確認"
    - "KYC"
    - "身分証"
    - "確認書類"
  template: |
    お問い合わせいただきありがとうございます。

    本人確認に関するお問い合わせですね。
    本人確認には以下の書類が必要です：

    ・身分証明書（運転免許証、パスポート、マイナンバーカードのいずれか）
    ・住所確認書類（公共料金の明細、銀行の取引明細など、3ヶ月以内のもの）

    マイページの「本人確認」メニューからアップロードしてください。
    審査結果はメールでお知らせいたします。
