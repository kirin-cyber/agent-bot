      弊社ではユーザー様の資金を最大限に保護するため、厳重なセキュリティ対策と慎重な処理を行っております。
      そのため、ご出金の処理にお時間を要する場合がございます。
      また、月曜日～土曜日のご入金に関しましては、2時間以内でウォレットに反映が完了いたします。
      ※混雑時は2時間以上反映にお時間を頂戴することがございます。
      また営業日であっても10時から18時以外、又は日・祝のご入金に関しましては翌営業日の反映となりますのでご認識のほどよろしくお願いいたします。
